spring:
  datasource:
    url: jdbc:h2:mem:bugtrace;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false

app:
  log:
    timezone: UTC
    incident-severities: WARN,ERROR,FATAL
  dashboard:
    trend-days: 14

logging:
  level:
    root: WARN
    com.bugtrace: INFO
