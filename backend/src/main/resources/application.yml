spring:
  application:
    name: bugtrace
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bugtrace?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
    username: ${DB_USERNAME:bugtrace}
    password: ${DB_PASSWORD:bugtrace}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  upload:
    max-file-size-bytes: 10485760
    allowed-extensions: .log,.txt
  log:
    timezone: ${LOG_TIMEZONE:UTC}
    incident-severities: WARN,ERROR,FATAL
  dashboard:
    trend-days: 14

logging:
  level:
    root: INFO
    com.bugtrace: INFO
